services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sidag-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
      - HOST=0.0.0.0
      - DATA_DIR=/app/data
      - DATA_FILE=/app/data/database.json
      - SQLITE_DB_PATH=/app/data/sidag.db
      - TZ=${TZ:-Asia/Makassar}
    volumes:
      - sidag_data:/app/data
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  sidag_data:
    driver: local
    name: sidag_assessment_data
